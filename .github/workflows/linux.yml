name: Linux.

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/linux.yml'
      - 'snap/**'
      - 'Telegram/build/**'
      - '!Telegram/build/docker/centos_env/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.bat'
      - 'Telegram/Telegram.plist'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/linux.yml'
      - 'snap/**'
      - 'Telegram/build/**'
      - '!Telegram/build/docker/centos_env/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.bat'
      - 'Telegram/Telegram.plist'
  workflow_dispatch:

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.ghcr_image }}
      cache_tag: ${{ steps.tag.outputs.ghcr_cache }}

    steps:
      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compute image tag.
        id: tag
        run: |
          HASH=$(sha256sum Telegram/build/docker/centos_env/Dockerfile Telegram/build/docker/centos_env/poetry.lock Telegram/build/docker/centos_env/pyproject.toml | sha256sum | cut -c1-12)
          echo "ghcr_image=ghcr.io/${{ github.repository_owner }}/tdesktop:centos_env-$HASH" >> $GITHUB_OUTPUT
          echo "ghcr_cache=ghcr.io/${{ github.repository_owner }}/tdesktop:centos_env-$HASH-cache" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx.
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: First set up.
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Build and push Docker image.
        uses: docker/build-push-action@v6
        with:
          context: Telegram/build/docker/centos_env
          push: true
          tags: ${{ steps.tag.outputs.ghcr_image }}
          cache-from: type=registry,ref=${{ steps.tag.outputs.ghcr_cache }}
          cache-to: type=registry,ref=${{ steps.tag.outputs.ghcr_cache }},mode=max,compression=zstd

  linux:
    name: Rocky Linux 8 Docker
    needs: build-image
    runs-on: ubuntu-latest

    strategy:
      matrix:
        defines:
          - ""
          - "DESKTOP_APP_DISABLE_X11_INTEGRATION"

    env:
      ONLY_CACHE: "false"

    steps:
      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pull Docker image.
        run: docker pull ${{ needs.build-image.outputs.image_tag }}

      - name: Cache build directory.
        uses: actions/cache@v4
        with:
          path: out
          key: build-${{ runner.os }}-${{ matrix.defines || 'null' }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '**/cmake/**') }}
          restore-keys: |
            build-${{ runner.os }}-${{ matrix.defines || 'null' }}-

      - name: Cache ccache directory.
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/.tdesktop-cache
          key: ccache-${{ runner.os }}-${{ matrix.defines || 'null' }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.defines || 'null' }}-

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo Define from matrix: $DEFINE
            echo "ARTIFACT_NAME=Telegram ${{ matrix.defines }}" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=Telegram" >> $GITHUB_ENV
          fi

          mkdir -p ${{ runner.temp }}/.tdesktop-cache

          docker run --rm \
            -u $(id -u) \
            -v $PWD:/usr/src/tdesktop \
            -v ${{ runner.temp }}/.tdesktop-cache:/var/cache/ccache \
            -e CONFIG=Release \
            -e CCACHE_SLOPPINESS=pch_defines,time_macros \
            -e CCACHE_MAXSIZE=5G \
            -e CCACHE_COMPRESS=1 \
            ${{ needs.build-image.outputs.image_tag }} \
            env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID }} \
            -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH }} \
            -D TDESKTOP_DISABLE_CRASH_REPORTS=ON \
            -D TDESKTOP_DISABLE_AUTOUPDATE=ON \
            $DEFINE

      - name: Check binary exists.
        run: |
          BIN="out/Release/Telegram"
          if [ ! -f "$BIN" ]; then
            echo "ERROR: $BIN not found!"
            ls -la out/ 2>/dev/null || echo "out/ directory does not exist"
            ls -la out/Release/ 2>/dev/null || echo "out/Release/ directory does not exist"
            exit 1
          fi
          file "$BIN"
          ls -lh "$BIN"

      - name: Upload artifact.
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: out/Release/Telegram
