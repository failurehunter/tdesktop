name: Linux.

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/linux.yml'
      - 'snap/**'
      - 'Telegram/build/**'
      - '!Telegram/build/docker/centos_env/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.bat'
      - 'Telegram/Telegram.plist'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/linux.yml'
      - 'snap/**'
      - 'Telegram/build/**'
      - '!Telegram/build/docker/centos_env/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.bat'
      - 'Telegram/Telegram.plist'
  workflow_dispatch:

jobs:

  linux:
    name: Rocky Linux 8 Docker
    runs-on: ubuntu-latest

    strategy:
      matrix:
        defines:
          - ""
          - "DESKTOP_APP_DISABLE_X11_INTEGRATION"

    env:
      ONLY_CACHE: "false"
      IMAGE_TAG: tdesktop:centos_env
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/tdesktop:centos_env

    steps:
      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx.
        id: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: First set up.
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Pull cached Docker image.
        run: |
          docker pull $GHCR_IMAGE || true

      - name: Build Docker image with cache.
        uses: docker/build-push-action@v6
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }},mode=max

      - name: Cache ccache directory.
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/.tdesktop-cache
          key: ccache-${{ runner.os }}-${{ matrix.defines || 'null' }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: ccache-${{ runner.os }}-${{ matrix.defines || 'null' }}-

      - name: Determine changed files.
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.cpp
            **/*.h
            **/*.cmake
            CMakeLists.txt
            Telegram/**/*.pro

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo Define from matrix: $DEFINE
            echo "ARTIFACT_NAME=Telegram ${{ matrix.defines }}" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=Telegram" >> $GITHUB_ENV
          fi

          mkdir -p ${{ runner.temp }}/.tdesktop-cache

          BUILD_ARGS=(
            -D CMAKE_CONFIGURATION_TYPES=Release
            -D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID }}
            -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH }}
            -D TDESKTOP_DISABLE_CRASH_REPORTS=ON
            -D TDESKTOP_DISABLE_AUTOUPDATE=ON
            $DEFINE
          )

          if [ "${{ steps.changed.outputs.any_changed }}" == "true" ] && [ -f ../out/CMakeCache.txt ]; then
            echo "Incremental build: only changed files"
            TARGETS=$(echo "${{ steps.changed.outputs.all_changed_files }}" | tr ' ' '\n' | sed 's|.*/||; s|\.cpp$||; s|\.h$||' | sort -u | head -20)
            docker run --rm \
              -u $(id -u) \
              -v $PWD:/usr/src/tdesktop \
              -v ${{ runner.temp }}/.tdesktop-cache:/var/cache/ccache \
              -e CONFIG=Release \
              -e CCACHE_SLOPPINESS=pch_defines,time_macros \
              $IMAGE_TAG \
              env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
              "${BUILD_ARGS[@]}" \
              --target $TARGETS
          else
            echo "Full build"
            docker run --rm \
              -u $(id -u) \
              -v $PWD:/usr/src/tdesktop \
              -v ${{ runner.temp }}/.tdesktop-cache:/var/cache/ccache \
              -e CONFIG=Release \
              -e CCACHE_SLOPPINESS=pch_defines,time_macros \
              $IMAGE_TAG \
              env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
              "${BUILD_ARGS[@]}"
          fi
